version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-supersecret}
      MYSQL_DATABASE: bhashasetu
    volumes:
      - mysql_data_prod:/var/lib/mysql

  backend:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-supersecret}
      - DB_NAME=bhashasetu
      - FRONTEND_URL=${FRONTEND_URL:-https://bhashasetu.com}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mysql

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ${API_URL:-https://api.bhashasetu.com}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data_prod:
